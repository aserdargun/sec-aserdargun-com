      <h1>AI Systems Security Observatory</h1>
      <p>
        SEC is a bilingual, evidence-aware observatory for tracing AI-agent trust from model intent
        through identity, authorization, constrained action, audit, and incident recovery. Every
        control carries its own evidence, assurance level, and sources; the site publishes no
        aggregate trust score and makes no site-wide pass or fail judgment.
      </p>
      <p>The observatory covers:</p>
      <ul>
        <li>Security brief and the trust path from model intent to incident recovery</li>
        <li>Threat map and a control matrix with per-control evidence and sources</li>
        <li>Scenarios, a standards crosswalk, and the stated methodology</li>
      </ul>
      <p>
        The full workbench needs JavaScript. With JavaScript disabled, this page lists what the
        observatory covers; the interactive evidence views are unavailable.
      </p>
